spring.application.name=SizeSure
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/sizesure?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:sizesure}
spring.datasource.password=${DB_PASSWORD:localdemo}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
